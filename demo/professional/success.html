<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request Received — V & ASSOCIATES</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
:root { --bg: #fdfdfd; --text: #1a1a1a; --accent: #1c2e4a; --gold: #b5a48b; --gray: #88888e; }
body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; }
.card { max-width: 600px; padding: 4rem; }
.line { width: 60px; height: 1px; background: var(--gold); margin: 0 auto 3rem; }
h1 { font-family: 'Cormorant Garamond', serif; font-size: 52px; font-weight: 300; margin-bottom: 2rem; color: var(--accent); }
p { line-height: 2; color: var(--gray); font-size: 16px; margin-bottom: 4rem; max-width: 450px; margin-left: auto; margin-right: auto; }
.home-btn { background: var(--accent); color: white; padding: 1.2rem 3rem; text-decoration: none; text-transform: uppercase; letter-spacing: 3px; font-size: 11px; transition: 0.3s; }
.home-btn:hover { background: #000; }
</style>
</head>
<body>
<div class="card">
  <div class="line"></div>
  <h1>Inquiry Received.</h1>
  <p>Thank you for reaching out. A senior associate is currently reviewing your briefing. We prioritize confidentiality and strategic timing. You will hear from us shortly.</p>
  <a href="index.html" class="home-btn">Return to Portal</a>
</div>
</body>
</html>
