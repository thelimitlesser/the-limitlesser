<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Limitlesser — Határok nélkül</title>
  <style>
    :root {
      --bg: #050200;
      --accent: #FF8A00;
      --white: #FFFFFF;
      --g1: rgba(255,255,255,0.6);
      --font-h: 'Inter', sans-serif;
      --font-d: 'Inter', sans-serif;
    }
    
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
    
    body { background: var(--bg); color: var(--white); font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
    
    /* Reveal */
    .rv { opacity: 0; transform: translateY(30px); transition: all 1s cubic-bezier(0.16, 1, 0.3, 1); }
    .rv.on { opacity: 1; transform: translateY(0); }

    .s-tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); margin-bottom: 1.5rem; }
    .s-title { font-family: var(--font-d); font-size: clamp(32px, 4vw, 54px); font-weight: 300; margin-bottom: 4rem; line-height: 1.2; }
    .s-title em { font-style: italic; color: var(--accent); }

    /* --- NEURAL MAP OVERHAUL --- */
    #results { background: #050200; overflow: hidden; position: relative; padding: 12rem 2rem; }
    .nm-bg-grid { position: absolute; inset: 0; background-image: radial-gradient(rgba(217,119,6,0.08) 1px, transparent 1px); background-size: 40px 40px; opacity: 0.4; pointer-events: none; }

    .nm-container {
      position: relative;
      max-width: 1200px;
      margin: 0 auto;
    }

    .nm-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 120px 320px; /* Horizontal gap 320px for the core */
      position: relative;
      z-index: 5;
    }

    .nm-node {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 2.2rem;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 1.5rem;
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 380px;
    }

    .nm-node.tl, .nm-node.bl { justify-self: end; text-align: right; flex-direction: row-reverse; }
    .nm-node.tr, .nm-node.br { justify-self: start; text-align: left; }

    .nm-node:hover {
      background: rgba(255,255,255,0.06);
      border-color: var(--accent);
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 30px 60px rgba(0,0,0,0.6);
    }

    .nm-node-icon {
      width: 54px; height: 54px;
      background: rgba(217,119,6,0.1);
      border: 1px solid rgba(217,119,6,0.2);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      color: var(--accent); flex-shrink: 0;
    }

    .nm-node-content p { font-size: 16px; font-weight: 400; line-height: 1.5; color: rgba(255,255,255,0.9); margin: 0; }

    /* Core - Pixel Perfect Absolute Centering */
    .nm-core-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 240px;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      pointer-events: none;
    }

    .nm-core {
      width: 130px;
      height: 130px;
      background: radial-gradient(circle at 30% 30%, #D97706 0%, #78350f 50%, #000 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 100px rgba(217,119,6,0.5), inset -10px -10px 30px rgba(0,0,0,0.8);
      position: relative;
      border: 1px solid rgba(255,255,255,0.2);
      pointer-events: auto;
    }

    .nm-core::after { content: 'L\00B7L'; font-family: var(--font-d); font-size: 28px; font-weight: 800; color: #fff; font-style: italic; z-index: 2; text-shadow: 0 0 15px rgba(255,255,255,0.8); letter-spacing: 2px; }

    .nm-orbit { position: absolute; border: 1px solid rgba(217,119,6,0.15); border-radius: 50%; animation: nm-orbit-rot 20s linear infinite; pointer-events: none; }
    .nm-orbit-1 { width: 230px; height: 230px; }
    .nm-orbit-2 { width: 320px; height: 320px; border-style: dashed; animation-duration: 35s; animation-direction: reverse; }

    /* SVG Lines - Coverage and Curves */
    .nm-lines-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .nm-line-path { stroke: var(--accent); stroke-width: 1.5; fill: none; opacity: 0.15; }
    .nm-bullet { stroke: var(--accent); stroke-width: 3.5; fill: none; stroke-dasharray: 6, 120; stroke-linecap: round; animation: nm-shoot 4s linear infinite; filter: drop-shadow(0 0 8px var(--accent)); }

    @keyframes nm-orbit-rot { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes nm-shoot { from { stroke-dashoffset: 126; } to { stroke-dashoffset: 0; } }

    @media(max-width:1100px) {
      .nm-grid { gap: 80px 100px; }
    }

    @media(max-width:950px) {
      #results { padding: 8rem 1rem; }
      .nm-grid { grid-template-columns: 1fr; gap: 4rem; padding-bottom: 2rem; }
      .nm-node { max-width: 100%; justify-self: center !important; text-align: center !important; flex-direction: column !important; }
      .nm-core-wrap, .nm-lines-svg, .nm-orbit { display: none; }
    }
  </style>
</head>
<body>

<section id="results">
  <div class="nm-bg-grid"></div>
  
  <div class="nm-container">
    <div style="text-align: center; margin-bottom: 6rem;" class="rv on">
      <span class="s-tag">Eredmények</span>
      <h2 class="s-title">Mit jelent ez a <em>gyakorlatban</em>?</h2>
    </div>

    <div class="nm-grid" id="nmGrid">
      <!-- TL -->
      <div class="nm-node tl rv on">
        <div class="nm-node-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <div class="nm-node-content">
          <p>Kevesebb manuális feladat a csapatod számára</p>
        </div>
      </div>

      <!-- TR -->
      <div class="nm-node tr rv on">
        <div class="nm-node-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        </div>
        <div class="nm-node-content">
          <p>Gyorsabb és átláthatóbb folyamatok</p>
        </div>
      </div>

      <!-- BL -->
      <div class="nm-node bl rv on">
        <div class="nm-node-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <div class="nm-node-content">
          <p>Jobb kontroll a működés felett</p>
        </div>
      </div>

      <!-- BR -->
      <div class="nm-node br rv on">
        <div class="nm-node-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <div class="nm-node-content">
          <p>Stabilabb alap a növekedéshez</p>
        </div>
      </div>
    </div>

    <!-- Core - Pixel Perfect Absolute Centering -->
    <div class="nm-core-wrap">
      <div class="nm-orbit nm-orbit-1"></div>
      <div class="nm-orbit nm-orbit-2"></div>
      <div class="nm-core rv on"></div>
    </div>

    <!-- SVG Curved Lines - Covered with Responsive Bezier -->
    <div class="nm-lines-svg">
      <svg viewBox="0 0 1000 600" preserveAspectRatio="none" style="width:100%; height:100%;">
        <!-- Quadratic Bezier: M [Center] Q [Control] [Target] -->
        <!-- Top Left -->
        <path class="nm-line-path" d="M500,300 Q 400,200 250,150" />
        <path class="nm-bullet" d="M500,300 Q 400,200 250,150" style="animation-delay: 0s;" />
        
        <!-- Top Right -->
        <path class="nm-line-path" d="M500,300 Q 600,200 750,150" />
        <path class="nm-bullet" d="M500,300 Q 600,200 750,150" style="animation-delay: 1s;" />
        
        <!-- Bottom Left -->
        <path class="nm-line-path" d="M500,300 Q 400,400 250,450" />
        <path class="nm-bullet" d="M500,300 Q 400,400 250,450" style="animation-delay: 2s;" />
        
        <!-- Bottom Right -->
        <path class="nm-line-path" d="M500,300 Q 600,400 750,450" />
        <path class="nm-bullet" d="M500,300 Q 600,400 750,450" style="animation-delay: 3s;" />
      </svg>
    </div>
  </div>
</section>

</body>
</html>
